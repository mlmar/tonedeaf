name: Test and build client

on:
    pull_request:
        branches:
            - main

permissions:
    contents: read

jobs:
    test:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: tonedeaf-react
        steps:
            - name: Check out repository
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm
                  cache-dependency-path: tonedeaf-react/package-lock.json

            - name: Install dependencies
              run: npm ci

            - name: Run tests
              run: npm test -- --run

            - name: Build client
              run: npm run build
